<!DOCTYPE html>
<html>
<head>
    <title>Мой первый кликер</title>
    <script src="https://vk.com/js/api/openapi.js?169"></script>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 20px;
            background: #f0f2f5;
        }
        #game {
            background: white;
            border-radius: 10px;
            padding: 20px;
            max-width: 300px;
            margin: 0 auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        button {
            background: #4a76a8;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="game">
        <h1>Кликер</h1>
        <p>Счёт: <span id="score">0</span></p>
        <button onclick="clickButton()">Жми!</button>
    </div>

    <script>
        let score = 0;
        
        function clickButton() {
            score++;
            document.getElementById('score').textContent = score;
            
            // Отправка счёта в VK
            if (typeof VK !== 'undefined') {
                VK.callMethod("setScore", score);
            }
        }
        
        // Инициализация VK
        if (typeof VK !== 'undefined') {
            VK.init({ apiId: 53521640 }); // Замените на ваш ID!
        }
    </script>
